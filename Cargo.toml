[workspace]
resolver = "3"
members = ["crates/raijuhash", "experiments", "benchmarks"]

[workspace.package]
edition = "2024"
# Minimum supported Rust version; newer releases are supported.
rust-version = "1.98.1"
license = "CC0-1.0 OR Apache-2.0 OR Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/raijuhash/raijuhash"

[profile.release]
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
lto = "thin"
codegen-units = 1
